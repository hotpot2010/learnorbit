version: '3.8'

services:
  backend-proxy:
    build: .
    container_name: backend-proxy
    ports:
      - "8002:8002"
    environment:
      - TARGET_SERVER=http://172.20.240.235:8000
      - PROXY_PORT=8002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

